[project]
name = "anaxer"
version = "0.1.1"
description = "Official Python SDK for the Anaxer Solana real-time data API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["solana", "pumpfun", "websocket", "dex", "real-time", "trading", "api", "sdk"]
dependencies = [
    "websockets>=12,<14",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.urls]
Repository = "https://github.com/Anaxer-v2/anaxer-sdk-python"
Repository = "https://github.com/Anaxer-v2/anaxer-sdk-python"
Homepage = "https://anaxer.com"
Documentation = "https://anaxer.com/docs/sdks"
Changelog = "https://anaxer.com/docs/changelog"
Issues = "https://anaxer.com/contact"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.4",
    "build>=1.2",
    "typing_extensions>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anaxer"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["anaxer"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "test_ws",
    "test_reconnect",
    "test_rest",
    "test_contract_examples",
    "test_models_compat",
    "mock_ws",
]
disallow_untyped_defs = false
check_untyped_defs = false
allow_untyped_defs = true
disable_error_code = ["type-arg", "no-untyped-def"]

# test_types.py intentionally uses type: ignore on negative cases — keep it under
# strict + warn_unused_ignores (do not loosen this module).

[tool.ruff]
line-length = 100
src = ["src", "test"]

[tool.ruff.lint]
ignore = ["S110", "PYI034"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["src"]
